<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0f172a" flood-opacity=".16"/>
    </filter>
    <linearGradient id="accent" x1="0" x2="1">
      <stop stop-color="#06b6d4"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
  </defs>

  <rect width="1440" height="900" fill="#f1f5f9"/>

  <rect x="0" y="0" width="288" height="900" fill="#ffffff"/>
  <rect x="287" y="0" width="1" height="900" fill="#e2e8f0"/>
  <text x="36" y="48" font-family="Sora, Arial" font-size="26" font-weight="800" fill="#0f172a">SinalTech</text>
  <text x="36" y="75" font-family="Arial" font-size="12" font-weight="700" fill="#64748b" letter-spacing="2">ADMINISTRATIVO</text>

  <g font-family="Arial" font-size="15" font-weight="700">
    <rect x="24" y="116" width="240" height="48" rx="14" fill="#0f172a"/>
    <text x="62" y="146" fill="#ffffff">Dashboard</text>
    <text x="62" y="206" fill="#334155">Escolas</text>
    <text x="62" y="266" fill="#334155">Usuários</text>
    <text x="62" y="326" fill="#334155">Áudios</text>
    <text x="62" y="386" fill="#334155">Auditoria</text>
  </g>
  <circle cx="42" cy="140" r="8" fill="#22d3ee"/>
  <circle cx="42" cy="200" r="8" fill="#cbd5e1"/>
  <circle cx="42" cy="260" r="8" fill="#cbd5e1"/>
  <circle cx="42" cy="320" r="8" fill="#cbd5e1"/>
  <circle cx="42" cy="380" r="8" fill="#cbd5e1"/>

  <rect x="312" y="28" width="1096" height="72" rx="22" fill="#ffffff" filter="url(#shadow)"/>
  <text x="344" y="58" font-family="Sora, Arial" font-size="22" font-weight="800" fill="#0f172a">Painel administrativo</text>
  <text x="344" y="80" font-family="Arial" font-size="13" font-weight="600" fill="#64748b">Gestão, auditoria, cadastros, aprovações e saúde operacional das escolas</text>
  <rect x="1188" y="45" width="44" height="44" rx="12" fill="#f1f5f9" stroke="#cbd5e1"/>
  <circle cx="1210" cy="67" r="9" fill="#64748b"/>
  <rect x="1248" y="45" width="128" height="44" rx="12" fill="#0f172a"/>
  <text x="1282" y="72" font-family="Arial" font-size="14" font-weight="800" fill="#ffffff">Admin</text>

  <g filter="url(#shadow)">
    <rect x="312" y="128" width="250" height="132" rx="22" fill="#ffffff"/>
    <rect x="586" y="128" width="250" height="132" rx="22" fill="#ffffff"/>
    <rect x="860" y="128" width="250" height="132" rx="22" fill="#ffffff"/>
    <rect x="1134" y="128" width="274" height="132" rx="22" fill="#ffffff"/>
  </g>
  <text x="340" y="168" font-family="Arial" font-size="13" font-weight="800" fill="#64748b">ESCOLAS ATIVAS</text>
  <text x="340" y="210" font-family="Sora, Arial" font-size="31" font-weight="800" fill="#0f172a">18</text>
  <text x="340" y="236" font-family="Arial" font-size="13" font-weight="700" fill="#64748b">2 sem horário publicado</text>

  <text x="614" y="168" font-family="Arial" font-size="13" font-weight="800" fill="#64748b">USUÁRIOS</text>
  <text x="614" y="210" font-family="Sora, Arial" font-size="31" font-weight="800" fill="#0f172a">42</text>
  <text x="614" y="236" font-family="Arial" font-size="13" font-weight="700" fill="#64748b">6 administradores</text>

  <text x="888" y="168" font-family="Arial" font-size="13" font-weight="800" fill="#64748b">ÁUDIOS</text>
  <text x="888" y="210" font-family="Sora, Arial" font-size="31" font-weight="800" fill="#0f172a">126</text>
  <text x="888" y="236" font-family="Arial" font-size="13" font-weight="700" fill="#64748b">82% do limite usado</text>

  <text x="1162" y="168" font-family="Arial" font-size="13" font-weight="800" fill="#64748b">APROVAÇÕES</text>
  <text x="1162" y="210" font-family="Sora, Arial" font-size="31" font-weight="800" fill="#0284c7">5</text>
  <text x="1162" y="236" font-family="Arial" font-size="13" font-weight="700" fill="#64748b">mudanças pendentes</text>

  <rect x="312" y="288" width="1096" height="214" rx="24" fill="#ffffff" filter="url(#shadow)"/>
  <text x="344" y="328" font-family="Sora, Arial" font-size="22" font-weight="800" fill="#0f172a">Pendências operacionais</text>
  <text x="344" y="354" font-family="Arial" font-size="13" font-weight="700" fill="#64748b">Itens que precisam de ação administrativa antes de aparecerem corretamente no link público</text>
  <g font-family="Arial" font-size="14" font-weight="800">
    <rect x="344" y="386" width="238" height="72" rx="18" fill="#fff7ed" stroke="#fed7aa"/>
    <text x="368" y="418" fill="#9a3412">2 escolas sem horário</text>
    <text x="368" y="442" fill="#c2410c" font-size="12">Abrir cadastro de escolas</text>

    <rect x="606" y="386" width="238" height="72" rx="18" fill="#fef2f2" stroke="#fecaca"/>
    <text x="630" y="418" fill="#991b1b">4 sinais sem áudio</text>
    <text x="630" y="442" fill="#dc2626" font-size="12">Revisar biblioteca</text>

    <rect x="868" y="386" width="238" height="72" rx="18" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="892" y="418" fill="#1d4ed8">5 aprovações</text>
    <text x="892" y="442" fill="#2563eb" font-size="12">Analisar solicitações</text>

    <rect x="1130" y="386" width="238" height="72" rx="18" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="1154" y="418" fill="#334155">3 alertas recentes</text>
    <text x="1154" y="442" fill="#64748b" font-size="12">Ver monitoramento</text>
  </g>

  <rect x="312" y="530" width="680" height="332" rx="24" fill="#ffffff" filter="url(#shadow)"/>
  <text x="344" y="570" font-family="Sora, Arial" font-size="21" font-weight="800" fill="#0f172a">Monitoramento e métricas HTTP</text>
  <text x="344" y="594" font-family="Arial" font-size="13" font-weight="700" fill="#64748b">Volume de requisições, erros 5xx, endpoint mais acessado e última coleta</text>
  <rect x="344" y="628" width="604" height="42" rx="12" fill="#f1f5f9"/>
  <text x="368" y="655" font-family="Arial" font-size="13" font-weight="800" fill="#475569">GET /api/public/schools/:token/player</text>
  <text x="850" y="655" font-family="Arial" font-size="13" font-weight="800" fill="#0284c7">1.284</text>
  <rect x="344" y="696" width="560" height="10" rx="5" fill="#bae6fd"/>
  <rect x="344" y="728" width="420" height="10" rx="5" fill="#bae6fd"/>
  <rect x="344" y="760" width="512" height="10" rx="5" fill="#bae6fd"/>
  <rect x="344" y="792" width="300" height="10" rx="5" fill="#bae6fd"/>
  <text x="344" y="832" font-family="Arial" font-size="13" font-weight="700" fill="#64748b">Última coleta: há 2 minutos</text>

  <rect x="1020" y="530" width="388" height="332" rx="24" fill="#ffffff" filter="url(#shadow)"/>
  <text x="1052" y="570" font-family="Sora, Arial" font-size="21" font-weight="800" fill="#0f172a">Auditoria recente</text>
  <text x="1052" y="594" font-family="Arial" font-size="13" font-weight="700" fill="#64748b">Últimas alterações relevantes</text>
  <g font-family="Arial" font-size="13" font-weight="700" fill="#475569">
    <rect x="1052" y="626" width="324" height="48" rx="14" fill="#f8fafc"/>
    <text x="1072" y="656">Usuário alterou horário</text>
    <rect x="1052" y="690" width="324" height="48" rx="14" fill="#f8fafc"/>
    <text x="1072" y="720">Áudio enviado</text>
    <rect x="1052" y="754" width="324" height="48" rx="14" fill="#f8fafc"/>
    <text x="1072" y="784">Escola desativada</text>
    <rect x="1052" y="818" width="324" height="30" rx="14" fill="#f8fafc"/>
    <text x="1072" y="839">Permissão atualizada</text>
